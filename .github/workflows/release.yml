name: Build, sign & release APK

# Releases are produced entirely in CI:
#   1. download the unmodified original APK (SHA-256 pinned)
#   2. apply the InstaLume branding patches (content-based, length-safe)
#   3. rebuild the APK (alignment-preserving repack)
#   4. sign it with the release key kept in GitHub Actions secrets
#   5. verify the signature (job fails if signing/verification fails)
#   6. publish ONLY the signed APK to the GitHub Release
#
# Required repository secrets (values are never printed):
#   INSTA_LUME_KEYSTORE_BASE64  base64 of the release keystore (never committed)
#   INSTA_LUME_KEYSTORE_PASSWORD keystore password
#   INSTA_LUME_KEY_ALIAS        key alias
#   INSTA_LUME_KEY_PASSWORD     key password

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_APK_SHA256: ecde5174e54fe026d99809afa28b7e99f8c50087561ea00cdb1292c1fae1adf0

jobs:
  release:
    name: Build, sign, verify, release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve signing tools
        run: |
          set -euo pipefail
          # Android build-tools (apksigner, aapt2) ship with the hosted runner.
          if [ -n "${ANDROID_HOME:-}" ]; then
            bt="$(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$bt" ]; then
              echo "Using build-tools: $bt"
              echo "$bt" >> "$GITHUB_PATH"
              export PATH="$bt:$PATH"
            fi
          fi
          if ! command -v apksigner >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq apksigner
          fi
          command -v apksigner
          apksigner --help >/dev/null 2>&1 || apksigner --version || true

      - name: Download original APK (integrity pinned)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_APK_URL: ${{ vars.SOURCE_APK_URL || 'https://github.com/sufiyan-sabeel/Insta-Lume/releases/download/source/InstaZen_438.0.0.28.88.apk' }}
        run: |
          set -euo pipefail
          mkdir -p build dist
          echo "Source: $SOURCE_APK_URL"
          # Release-asset CDN can lag right after upload -> retry, then fall
          # back to the authenticated API asset route (same repository).
          ok=0
          for i in 1 2 3 4 5; do
            rm -f build/source.apk
            if curl -fL --connect-timeout 30 --max-time 900 \
                 -o build/source.apk "$SOURCE_APK_URL"; then
              ok=1; break
            fi
            echo "download attempt $i failed; retrying in 30s"
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "browser URL failed, trying API asset route"
            AID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/source" --jq '.assets[0].id')"
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$AID" -o build/source.apk
          fi
          echo "${SOURCE_APK_SHA256}  build/source.apk" | sha256sum -c -
          echo "Source APK verified ($(stat -c %s build/source.apk) bytes)"

      - name: Extract source APK
        run: unzip -q build/source.apk -d build/work

      - name: Apply InstaLume branding patches
        run: |
          set -euo pipefail
          W=build/work

          # 1. Launcher label: unique resources.arsc pool string
          python3 tools/patch_arsc_label.py "$W/resources.arsc" InstaZen InstaLume

          # 2. Crash toast (dex string, equal length: 59 bytes)
          python3 tools/patch_dex_string.py "$W/classes21.dex" \
            'InstaZen has crashed. Please share the crash log via Gmail.' \
            'InstaLume has crashed. Please share the crash log via Gmail'

          # 3. Native library: strictly same-length, whole-string, in-place swaps
          #    (the Dex2C string blob is addressed positionally - length must not change)
          python3 tools/patch_so_strings.py "$W/lib/arm64-v8a/libinstazen.so" \
            --replace 'https://www.paypal.com/paypalme/SpoilerTech' \
                      'http://github.com/sufiyan-sabeel/Insta-Lume' \
            --replace 'https://raw.githubusercontent.com/SpoilerTech/InstaZen/refs/heads/main/Donations.json' \
                      'https://raw.githubusercontent.com/sufiyan-sabeel/Insta-Lume/main/Donations-empty.json'

          python3 tools/patch_so_strings.py "$W/lib/arm64-v8a/libinstazen.so" --pad \
            --replace 'PayPal' 'GitHub' \
            --replace 'UPI ID' 'Handle' \
            --replace 'UPI ID copied! Open any UPI app to pay' 'Link copied! Open it in your browser.' \
            --replace 'spoilertechuco@ybl' 'sufiyan-sabeel' \
            --replace 'spoilertechuco@ybl (Tap to copy)' 'sufiyan-sabeel (Tap to copy)' \
            --replace 'Cannot open PayPal' 'Cannot open link' \
            --replace 'UPI data not loaded' 'Nothing to show' \
            --replace 'PayPal ID Copied' 'Link copied!' \
            --replace 'PayPal link not loaded yet' 'Link not loaded yet' \
            --replace 'UPI Payment' 'Payment' \
            --replace 'com.paypal.android.p2pmobile' 'com.instalume.disabled.shell' \
            --replace 'InstaZen Testers' 'InstaLume Tester' \
            --replace 'InstaZen V8.5' 'Lume V8.5' \
            --replace 'InstaZen Settings' 'Lume Settings' \
            --replace 'Your support helps us keep InstaZen free & updated!' 'Your support helps keep InstaLume free & updated!' \
            --replace 'InstaZen' 'Lume'

      - name: Build APK
        run: python3 tools/build_apk.py build/work dist/InstaLume-unsigned.apk

      - name: Validate rebuilt APK (fails job on error)
        run: python3 tools/validate_apk.py dist/InstaLume-unsigned.apk build/work

      - name: Decode release keystore from secrets
        env:
          INSTA_LUME_KEYSTORE_BASE64: ${{ secrets.INSTA_LUME_KEYSTORE_BASE64 }}
          INSTA_LUME_KEYSTORE_PASSWORD: ${{ secrets.INSTA_LUME_KEYSTORE_PASSWORD }}
          INSTA_LUME_KEY_ALIAS: ${{ secrets.INSTA_LUME_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing
          printf '%s' "$INSTA_LUME_KEYSTORE_BASE64" | base64 -d > signing/instalume-release.keystore
          keytool -list \
            -keystore signing/instalume-release.keystore \
            -storepass "$INSTA_LUME_KEYSTORE_PASSWORD" \
            -alias "$INSTA_LUME_KEY_ALIAS" > /dev/null
          echo "release keystore loaded (alias set, credentials accepted)"

      - name: Sign APK with release key
        env:
          KS_STOREPASS: ${{ secrets.INSTA_LUME_KEYSTORE_PASSWORD }}
          KS_KEYPASS: ${{ secrets.INSTA_LUME_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.INSTA_LUME_KEY_ALIAS }}
        run: |
          set -euo pipefail
          command -v apksigner > /dev/null
          apksigner sign \
            --ks signing/instalume-release.keystore \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_STOREPASS \
            --key-pass env:KS_KEYPASS \
            --out dist/InstaLume.apk \
            dist/InstaLume-unsigned.apk
          echo "signing complete"

      - name: Verify signature (fails job on error)
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs dist/InstaLume.apk
          # never publish an unsigned artifact
          rm -f dist/InstaLume-unsigned.apk
          test ! -e dist/InstaLume-unsigned.apk

      - name: Collect build metadata
        id: meta
        run: |
          set -euo pipefail
          APK=dist/InstaLume.apk
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c %s "$APK")"
          SIZE_H="$(du -h "$APK" | cut -f1)"
          PKG="com.instazen.android"
          if command -v aapt2 >/dev/null 2>&1; then
            DETECTED="$(aapt2 dump badging "$APK" 2>/dev/null | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1 || true)"
            if [ -n "$DETECTED" ]; then PKG="$DETECTED"; fi
          fi
          {
            echo "sha=$SHA"
            echo "size=$SIZE"
            echo "size_h=$SIZE_H"
            echo "pkg=$PKG"
          } >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"
          echo "Size: $SIZE bytes ($SIZE_H)"
          echo "Package: $PKG"

      - name: Assemble release notes
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          {
            cat release-notes.md
            echo ""
            echo "## Build details"
            echo ""
            echo "- **Build status:** signed & verified in CI (apksigner verify passed)"
            echo "- **APK file:** InstaLume-${TAG}.apk"
            echo "- **APK size:** ${{ steps.meta.outputs.size_h }} (${{ steps.meta.outputs.size }} bytes)"
            echo "- **SHA-256:** \`${{ steps.meta.outputs.sha }}\`"
            echo "- **Package:** \`${{ steps.meta.outputs.pkg }}\`"
            echo "- **Git commit:** \`${GITHUB_SHA}\`"
            echo "- **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > dist/release-notes.md
          mv dist/InstaLume.apk "dist/InstaLume-${TAG}.apk"

      - name: Publish GitHub Release (signed APK only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: InstaLume ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: dist/InstaLume-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
